<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
@font-face { font-family: 'SS Serif'; src: url('fonts/SimpleSerenitySerif.ttf'); }
@font-face { font-family: 'SS Script'; src: url('fonts/SimpleSerenityScript.ttf'); }
body { background:#f3f1ec; color:#1a1a1a; margin:0; padding:60px; }
.serif { font-family:'SS Serif'; }
.script { font-family:'SS Script'; }
.row { margin-bottom:40px; border-bottom:1px solid #ccc; padding-bottom:20px; }
.lbl { font-family:monospace; font-size:12px; color:#888; }
h1 { font-size:90px; margin:10px 0; }
h2 { font-size:48px; margin:10px 0; }
p { font-size:24px; margin:6px 0; }
</style>
</head>
<body>
<div class="row">
<div class="lbl">SIMPLE SERENITY SERIF</div>
<h1 class="serif">VERO Design Studio</h1>
<h2 class="serif">Crafted Interiors &amp; Bespoke Joinery</h2>
<p class="serif">ABCDEFGHIJKLM abcdefghijklm 0123456789 &amp; — “quotes”</p>
</div>
<div class="row">
<div class="lbl">SIMPLE SERENITY SCRIPT</div>
<h1 class="script">VERO Design Studio</h1>
<h2 class="script">Crafted Interiors &amp; Bespoke Joinery</h2>
<p class="script">ABCDEFGHIJKLM abcdefghijklm 0123456789</p>
</div>
</body>
</html>
